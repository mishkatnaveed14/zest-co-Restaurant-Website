<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | ZestCo</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #151619; color: #f5f5f7; }
    main { width: min(520px, calc(100% - 40px)); padding: 48px 36px; text-align: center; border: 1px solid rgba(212, 175, 55, .35); border-radius: 18px 0 18px 0; background: #202126; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
    .mark { margin: 0 auto 22px; width: 64px; height: 64px; display: grid; place-items: center; border: 1px solid #d4af37; border-radius: 16px 0 16px 0; color: #d4af37; font-size: 28px; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { margin: 0 0 28px; color: #c4c4c8; font: 15px/1.6 Arial, sans-serif; }
    a { display: inline-block; padding: 12px 22px; border-radius: 10px 0 10px 0; background: #d4af37; color: #17181b; font: 700 13px Arial, sans-serif; text-decoration: none; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">!</div>
    <h1>Access Denied</h1>
    <p>This area is reserved for authorized administrators. Your account does not have permission to view the admin dashboard.</p>
    <a href="../../index.html">Return to Zest &amp; Co.</a>
  </main>
</body>
</html>
