<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dasboard</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../css-folder/admin-css/admin-common.css">
    <link rel="stylesheet" href="../../../css-folder/admin-css/admin-dashboard.css">
</head>

<body>
    <!-- ===================================== aside bar start ======================================= -->
    <!-- Mobile Header -->
    <div class="mobile-header">
        <div class="d-flex align-items-center gap-3">
            <!-- Animated Hamburger Button -->
            <button class="hamburger-btn" id="mobileSidebarToggle" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <a href="./dasboard.html" class="sidebar-brand p-0 mb-0">
                <i class="bi bi-cup-hot-fill brand-logo-icon"></i>
                <span>ZestCo</span>
            </a>
        </div>
    </div>

    <!-- Backdrop Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Drawer -->
    <aside class="sidebar" id="sidebar">
        <div>
            <!-- Professional Logo Header Trigger (Cleans up extra buttons) -->
            <div class="sidebar-brand-wrapper" id="brandToggleTrigger" title="Click to Collapse / Expand Sidebar">
                <!-- Sidebar Drawer Header -->
                <div class="sidebar-brand-wrapper" id="brandToggleTrigger" title="Click to Collapse / Expand Sidebar">
                    <div class="sidebar-brand">
                        <i class="bi bi-cup-hot-fill brand-logo-icon"></i>
                        <span class="link-text">ZestCo Admin</span>
                    </div>

                    <!-- Desktop Chevron Indicator -->
                    <i class="bi bi-chevron-left brand-toggle-arrow d-none d-lg-inline-block"></i>

                    <!-- Mobile Close (X) Button -->
                    <button class="drawer-close-btn d-lg-none" id="mobileDrawerClose" aria-label="Close Drawer">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="sidebar-brand">
                    <i class="bi bi-cup-hot-fill brand-logo-icon"></i>
                    <span class="link-text">ZestCo Admin</span>
                </div>
                <i class="bi bi-chevron-left brand-toggle-arrow d-none d-lg-inline-block"></i>
            </div>

            <!-- Navigation Items -->
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="./dasboard.html" class="nav-link-custom active" title="Dashboard">
                        <span class="link-content">
                            <i class="bi bi-grid-1x2-fill icon"></i>
                            <span class="link-text">Dashboard</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./orders.html" class="nav-link-custom" title="Orders">
                        <span class="link-content">
                            <i class="bi bi-cart3 icon"></i>
                            <span class="link-text">Orders</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./menu.html" class="nav-link-custom" title="Menu">
                        <span class="link-content">
                            <i class="bi bi-journal-richtext icon"></i>
                            <span class="link-text">Menu</span>
                        </span>
                    </a>
                </li>

                <!-- Inventory Dropdown Toggle -->
                <li class="nav-item">
                    <a href="#" class="nav-link-custom" id="inventoryToggle" title="Inventory">
                        <span class="link-content">
                            <i class="bi bi-box-seam icon"></i>
                            <span class="link-text">Inventory</span>
                        </span>
                        <i class="bi bi-chevron-down chevron-icon"></i>
                    </a>

                    <!-- Submenu Pages -->
                    <ul class="submenu" id="inventorySubmenu">
                        <li class="nav-item">
                            <a href="./inventory.html" class="nav-link-custom">
                                <span class="link-content">
                                    <i class="bi bi-dot icon"></i>
                                    <span class="link-text">Stock Inventory</span>
                                </span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./purchase-order.html" class="nav-link-custom">
                                <span class="link-content">
                                    <i class="bi bi-dot icon"></i>
                                    <span class="link-text">Purchase Order</span>
                                </span>
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a href="./messages.html" class="nav-link-custom" title="Messages">
                        <span class="link-content">
                            <i class="bi bi-chat-dots icon"></i>
                            <span class="link-text">Messages</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./calendar.html" class="nav-link-custom" title="Calendar">
                        <span class="link-content">
                            <i class="bi bi-calendar-event icon"></i>
                            <span class="link-text">Calendar</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./reveiws.html" class="nav-link-custom" title="Reviews">
                        <span class="link-content">
                            <i class="bi bi-star icon"></i>
                            <span class="link-text">Reviews</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./setting.html" class="nav-link-custom" title="Settings">
                        <span class="link-content">
                            <i class="bi bi-gear icon"></i>
                            <span class="link-text">Settings</span>
                        </span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- ===================================== aside bar end ======================================= -->

    <!--================= Top Navbar Header start ======================== -->
    <!-- Top Synchronized Header Bar -->
    <main class="main-content">
        <header class="top-navbar" id="topNavbar">
            <div class="header-left">
                <div class="header-title">
                    <h1 class="m-0 fs-4 fw-bold title-text">Dashboard</h1>
                    <p class="text-muted m-0 small subtitle-text">Hello Alexander, welcome back!</p>
                </div>
            </div>

            <!-- Right Controls Section -->
            <div class="header-right">
                <!-- Search Bar with Dynamic Expand Animation -->
                <div class="search-box d-none d-md-flex" id="searchBox">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" placeholder="Search anything..." class="search-input">
                </div>

                <!-- Action Controls -->
                <div class="header-actions">
                    <!-- Mobile Search Toggle -->
                    <button class="action-btn d-md-none" id="mobileSearchBtn" title="Search">
                        <i class="bi bi-search"></i>
                    </button>

                    <!-- Notifications Button -->
                    <button class="action-btn position-relative" id="notificationBtn" title="Notifications">
                        <i class="bi bi-bell"></i>
                        <span class="notification-badge"></span>
                    </button>

                    <!-- Messages Button -->
                    <button class="action-btn position-relative" id="messageBtn" title="Messages">
                        <i class="bi bi-chat-text"></i>
                        <span class="notification-badge bg-gold"></span>
                    </button>
                </div>

                <!-- User Profile Dropdown -->
                <div class="user-profile-dropdown" id="userProfileDropdown">
                    <div class="profile-trigger" id="profileTrigger">
                        <img src="https://ui-avatars.com/api/?name=Alexander+R&background=D4AF37&color=fff"
                            alt="User Profile" class="profile-avatar">
                        <div class="profile-info d-none d-xl-block">
                            <span class="profile-name">Alexander R.</span>
                            <span class="profile-role">Admin</span>
                        </div>
                        <i class="bi bi-chevron-down profile-chevron d-none d-sm-inline-block"></i>
                    </div>

                    <!-- Profile Popup Menu -->
                    <div class="profile-menu" id="profileMenu">
                        <a href="./setting.html" class="profile-menu-item">
                            <i class="bi bi-person"></i>
                            <span>My Profile</span>
                        </a>
                        <a href="./setting.html" class="profile-menu-item">
                            <i class="bi bi-gear"></i>
                            <span>Account Settings</span>
                        </a>
                        <hr class="dropdown-divider my-1">
                        <a href="#" class="profile-menu-item text-danger">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>
        </main>
        <!--================= Top Navbar Headerend ======================== -->



        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <script src="../../../js/admin-js/admin-common.js"></script>
        <script src="../../../js/admin-js//admin-dashboard.js"></script>
</body>

</html>
