<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D9A8"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <linearGradient id="emblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2126"/>
      <stop offset="100%" stop-color="#0C0D10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.22)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
  </defs>

  <!-- Subtle glow -->
  <circle cx="110" cy="110" r="104" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="110" cy="110" r="96" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>

  <!-- Emblem disc -->
  <circle cx="110" cy="110" r="84" fill="url(#emblem)"/>

  <!-- Fine inner ring -->
  <circle cx="110" cy="110" r="78" fill="none" stroke="rgba(201,162,39,0.35)" stroke-width="1"/>

  <!-- Stylized Flame / Zest mark -->
  <g transform="translate(110 96)">
    <!-- Outer flame silhouette -->
    <path d="M0 -38 C-6 -22 -20 -12 -20 4 C-20 18 -8 28 0 28 C8 28 20 18 20 4 C20 -12 6 -22 0 -38 Z"
          fill="url(#gold)"/>
    <!-- Inner flame -->
    <path d="M0 -20 C-3 -10 -12 -4 -12 4 C-12 12 -6 18 0 18 C6 18 12 12 12 4 C12 -4 3 -10 0 -20 Z"
          fill="#0C0D10" opacity="0.85"/>
    <path d="M0 -14 C-2 -7 -8 -2 -8 3 C-8 8 -4 12 0 12 C4 12 8 8 8 3 C8 -2 2 -7 0 -14 Z"
          fill="url(#gold)"/>
  </g>

  <!-- Rising steam / spark lines -->
  <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M74 98 C70 90 70 82 74 74"/>
    <path d="M146 98 C150 90 150 82 146 74"/>
  </g>

  <!-- Base platter arc -->
  <path d="M82 128 C96 138 124 138 138 128" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wordmark: ZEST -->
  <text x="110" y="158" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="url(#gold)" letter-spacing="2">ZEST</text>

  <!-- Wordmark: & CO -->
  <text x="110" y="180" text-anchor="middle" font-family="'Jost', Arial, sans-serif" font-size="14" fill="rgba(245,245,247,0.7)" letter-spacing="5">&amp; CO.</text>
</svg>
